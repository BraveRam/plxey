name: bot CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        env:
          # Tests stub Neon/Upstash; these placeholders satisfy the
          # module-load checks in packages/db without making a real
          # connection. The actual DB URL is only used by integration
          # paths we don't run in CI.
          DATABASE_URL: "postgres://test:test@localhost:5432/test"
          UPSTASH_REDIS_REST_URL: "https://example.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "test-token"
          ENCRYPTION_KEY: "test-encryption-key-thirty-two-bytes-long"
          BOT_TOKEN: "test-bot-token"
          AI_GATEWAY_API_KEY: "test-ai-gateway-key"
        run: bun test
